<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso | Hexomel 🐝</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/modern.css">
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfdfd;
            padding: 20px;
        }
        .success-card {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 60px 40px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.05);
            border: 1px solid #f0f3f0;
            position: relative;
            overflow: hidden;
        }
        .bee-decoration {
            position: absolute;
            font-size: 2rem;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            50% { transform: translate(15px, -15px) rotate(10deg); }
        }
        .success-icon {
            width: 100px;
            height: 100px;
            background: var(--success-color, #1c5236);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(28, 82, 54, 0.2);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .order-number {
            display: inline-block;
            padding: 10px 20px;
            background: #f8faf8;
            border-radius: 50px;
            font-weight: 700;
            color: var(--primary-green);
            margin: 20px 0;
            border: 1px solid #eef1ee;
        }
        .btn-go-home {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
        }
        .btn-go-home:hover {
            background: #153d28;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            color: white;
        }
    </style>
    <meta name="view-transition" content="same-origin" />
  </head>
<body class="success-page">
    <div class="success-card">
        <i class="fas fa-bee bee-decoration" style="top: 10%; left: 10%;"></i>
        <i class="fas fa-bee bee-decoration" style="bottom: 10%; right: 10%; animation-delay: 2s;"></i>
        
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        
        <h1 style="font-weight: 800; color: #1c5236;">Encomenda Recebida!</h1>
        <p class="text-muted" style="font-size: 1.1rem;">A tua encomenda foi processada com sucesso pela nossa colmeia.</p>
        
        <div id="order-info" class="order-number">
            A carregar pedido...
        </div>

        <p id="payment-status" style="font-size: 0.95rem; color: #4b5563; margin: 12px auto 0; max-width: 430px;"></p>

        <p style="font-size: 0.9rem; color: #666; max-width: 400px; margin: 0 auto;">
            Enviámos um email de confirmação com todos os detalhes. Podes acompanhar o estado no teu perfil.
        </p>

        <a href="index.html" class="btn-go-home">Voltar ao Início</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('orderId');
            const sessionId = params.get('session_id');
            const orderInfoEl = document.getElementById('order-info');
            const paymentStatusEl = document.getElementById('payment-status');

            const renderFallback = () => {
                if (orderId) {
                    orderInfoEl.innerHTML = `ID Encomenda: #${orderId}`;
                }
            };

            const validateStripeSession = async () => {
                if (!sessionId) {
                    renderFallback();
                    return;
                }

                try {
                    const res = await fetch(`/api/checkout/session-status?session_id=${encodeURIComponent(sessionId)}`);
                    if (!res.ok) {
                        throw new Error('session_validation_failed');
                    }

                    const data = await res.json();
                    if (data.orderId) {
                        orderInfoEl.innerHTML = `ID Encomenda: #${data.orderId}`;
                    } else {
                        renderFallback();
                    }

                    paymentStatusEl.textContent =
                        data.paymentStatus === 'paid'
                            ? 'Pagamento confirmado pela Stripe.'
                            : `Estado do pagamento: ${data.paymentStatus || 'em processamento'}.`;
                } catch (error) {
                    renderFallback();
                    paymentStatusEl.textContent =
                        'Não foi possível validar automaticamente o pagamento nesta página.';
                }
            };

            validateStripeSession();

            // Clear the local cart
            localStorage.removeItem('cart');
            
            // If there's a cart-count element in the page (though we are on success page), it might not matter
            // but for good measure we can trigger an event if we had a shared script
        });
    </script>
</body>
</html>
