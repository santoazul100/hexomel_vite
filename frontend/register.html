<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up - Hexomel</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <script src="/src/pre-load.js"></script>
  </head>
  <body class="auth-page position-relative">
    <!-- Floating Bees -->
    <div
      class="bee-container z-0"
      style="
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
        top: 0;
        left: 0;
        overflow: hidden;
      "
    >
      <img
        src="abelha/abelha.webp"
        class="bee-decoration"
        alt="Bees"
        style="top: 10%; left: 8%; width: 55px"
      />
      <img
        src="abelha/abelha_inverso.webp"
        class="bee-decoration"
        alt="Bees"
        style="bottom: 15%; right: 10%; width: 40px"
      />
    </div>

    <div class="auth-card position-relative z-1">
      <h1 class="auth-title">Sign up</h1>
      <p class="auth-subtitle">Join our community of honey lovers</p>

      <!-- Redundant button removed for cleaner Atlas style -->

      <form class="auth-form" id="registerForm">
        <div class="input-row">
          <div class="floating-label-group">
            <input
              type="text"
              id="firstName"
              class="floating-input"
              placeholder=" "
              required
            />
            <label class="floating-label">First Name*</label>
          </div>
          <div class="floating-label-group">
            <input
              type="text"
              id="lastName"
              class="floating-input"
              placeholder=" "
              required
            />
            <label class="floating-label">Last Name*</label>
          </div>
        </div>

        <div class="floating-label-group">
          <input
            type="email"
            id="email"
            class="floating-input"
            placeholder=" "
            required
          />
          <label class="floating-label">Email*</label>
        </div>

        <div class="floating-label-group">
          <input
            type="password"
            id="password"
            class="floating-input"
            placeholder=" "
            required
          />
          <label class="floating-label">Password*</label>
        </div>

        <label
          style="
            display: flex;
            gap: 0.5rem;
            font-size: var(--text-sm);
            color: var(--text-medium);
            margin-bottom: 2rem;
            cursor: pointer;
          "
        >
          <input type="checkbox" required />
          I agree to the Terms of Service and Privacy Policy.
        </label>

        <button type="submit" class="auth-submit">Create your account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>

      <div style="margin-top: 2rem">
        <a
          href="/"
          style="
            color: var(--text-light);
            text-decoration: none;
            font-size: var(--text-sm);
          "
          >← Back to home</a
        >
      </div>
    </div>

    <script type="module" src="/src/beeAnimation.js"></script>
    <script type="module" src="/src/auth.js"></script>
  </body>
</html>
