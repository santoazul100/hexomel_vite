<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="apis.title">Apicultores - Hexomel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="src/styles/index.css" />
    <link rel="stylesheet" href="src/styles/modern.css" />
    <!-- Favicon -->
    <link rel="icon" href="/favicon.webp" type="image/x-icon" />
    <!-- Pre-load state detection -->
    <script src="src/pre-load.js"></script>
      <meta name="view-transition" content="same-origin" />
  </head>
  <body>
    <!-- Navbar (Premium Overhaul) -->
    <div id="navbar-container"></div>

    <main style="padding-top: 120px;">
      <section class="container py-5">
        <div class="text-center mb-5 animate-fade-up">
          <span class="product-badge-premium mb-3 d-inline-block" data-i18n="apis.badge">NOSSOS PRODUTORES</span>
          <h1 class="display-4 fw-bold" style="color: var(--primary-green)" data-i18n="apis.heading">Nossos Apicultores</h1>
          <p class="text-muted fs-5" data-i18n="apis.subtitle">Conheça os apicultores que dedicam a sua vida à produção do melhor mel artesanal.</p>
        </div>

        <div class="row g-4" id="beekeepers-grid">
            <!-- Injected by apicultores.js -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-success" role="status"></div>
            </div>
        </div>
      </section>
    </main>

    <!-- Footer Standard -->
    <!-- (Assuming common layout scripts will handle footer or it's copied) -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="src/beeAnimation.js"></script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/apicultores.js"></script>
  </body>
</html>
