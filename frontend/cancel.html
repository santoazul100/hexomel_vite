<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Cancelado | Hexomel 🐝</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/modern.css">
    <style>
        .cancel-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfdfd;
            padding: 20px;
        }
        .cancel-card {
            max-width: 500px;
            width: 100%;
            text-align: center;
            padding: 50px 30px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.05);
            border: 1px solid #f0f3f0;
        }
        .cancel-icon {
            width: 80px;
            height: 80px;
            background: #fff5f5;
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 30px;
        }
        .btn-retry {
            background: var(--primary-green);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .btn-retry:hover {
            background: #153d28;
            color: white;
            transform: translateY(-2px);
        }
    </style>
    <meta name="view-transition" content="same-origin" />
  </head>
<body class="cancel-page">
    <div class="cancel-card">
        <div class="cancel-icon">
            <i class="fas fa-times"></i>
        </div>
        <h2 style="font-weight: 800; color: #1c5236;">Pagamento Cancelado</h2>
        <p class="text-muted">Parece que o pagamento não foi concluído. Não te preocupes, os teus itens ainda estão no carrinho.</p>
        
        <div class="d-flex flex-column gap-2 mt-4">
            <a href="checkout.html" id="retry-link" class="btn-retry">Tentar Novamente</a>
            <a href="shop.html" class="text-decoration-none text-muted small mt-2">Voltar à Loja</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('orderId');
            if (orderId) {
                const retryLink = document.getElementById('retry-link');
                if (retryLink) {
                    retryLink.href = `checkout.html?orderId=${orderId}`;
                }
            }
        });
    </script>
</body>
</html>
