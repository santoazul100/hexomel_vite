<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teste Abelha</title>
<style>
  body, html {
    margin: 0; padding: 0; height: 100vh; overflow: hidden;
    background: #666;
    display: flex; justify-content: center; align-items: center;
    color: white; font-family: Arial, sans-serif;
  }
  .hero {
    position: relative;
    width: 600px;
    height: 400px;
    background: #999;
  }
  .logo-move {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: transform 0.2s ease-out;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="hero">
  <img src="https://upload.wikimedia.org/wikipedia/commons/7/70/Honeybee_-_Apis_mellifera%2C_aka.jpg" 
       alt="Abelha" class="logo-move" />
</div>

<script>
  const logo = document.querySelector('.logo-move');
  let targetX = 0;
  let targetY = 0;
  let currentX = 0;
  let currentY = 0;

  document.addEventListener('mousemove', e => {
    const offsetX = (window.innerWidth / 2 - e.clientX) / 20;
    const offsetY = (window.innerHeight / 2 - e.clientY) / 20;

    targetX = Math.max(Math.min(offsetX, 50), -50);
    targetY = Math.max(Math.min(offsetY, 50), -50);
  });

  function animate() {
    currentX += (targetX - currentX) * 0.1;
    currentY += (targetY - currentY) * 0.1;

    logo.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px))`;

    requestAnimationFrame(animate);
  }
  animate();
</script>

</body>
</html>
